name: Update sitemap

on:
  push:
    paths:
      - "**/*.html"
      - "scripts/generate_sitemap.py"

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate sitemap.xml
        run: python3 scripts/generate_sitemap.py

      - name: Commit sitemap if changed
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: auto-update sitemap.xml"
            git push
          else
            echo "sitemap.xml already up to date"
          fi
